<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tavistock Abbey Bridge · 3D Drone Video Virtual Tour | Mo360 Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #061019;
      --panel: rgba(8, 22, 34, 0.90);
      --gold: #F59E0B;
      --cyan: #4ca8b8;
      --text: #FFFFFF;
      --muted: #B4C5D0;
      --border: rgba(245, 158, 11, 0.38);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    #stage360 { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: grab; }
    #stage360.dragging { cursor: grabbing; }

    .top-bar {
      position: fixed; top: 14px; left: 16px; right: 16px; z-index: 20;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 18px; border-radius: 2px; background: var(--panel); border: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .brand h1 { font-size: 1rem; font-weight: 800; color: var(--text); }
    .brand p { font-size: 0.76rem; color: var(--muted); }
    .top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .btn {
      padding: 8px 14px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(14, 34, 52, 0.9); color: var(--text); font-family: inherit;
      font-size: 0.76rem; font-weight: 700; cursor: pointer; text-decoration: none;
      transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold); }
    .btn.active { background: #10b981; color: #04121a; border-color: transparent; }
    .btn.gold { background: var(--gold); color: #06080b; border-color: transparent; }

    .bottom-dock {
      position: fixed; bottom: 14px; left: 16px; right: 16px; z-index: 20;
      padding: 12px 18px; border-radius: 2px; background: var(--panel); border: 1px solid var(--border);
      backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 10px;
    }
    .dock-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .node-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .node-btn {
      padding: 7px 13px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(8, 18, 28, 0.9); color: var(--muted); font-family: inherit;
      font-size: 0.74rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .node-btn.active { background: var(--gold); color: #06080b; border-color: var(--gold); }
    .hint { font-size: 0.78rem; color: var(--gold); font-weight: 600; }

    @media (max-width: 720px) {
      .brand p { display: none; }
      .btn, .node-btn { font-size: 0.72rem; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div id="stage360" title="Drag to look around the 3D VR Cinema Sanctuary"></div>

  <header class="top-bar">
    <div class="brand">
      <h1>Tavistock Abbey Bridge · 3D Drone Video Virtual Tour</h1>
      <p>Google Flow 16:9 Live Drone Flight + Narrator Audio inside WebXR Curved Cinema · Mo360 Studio</p>
    </div>
    <div class="top-actions">
      <button type="button" class="btn" id="narratorBtn">🔇 Tap for Google Flow Narrator</button>
      <button type="button" class="btn active" id="playPauseBtn">⏸ Pause Flight</button>
      <a href="tavistock-heritage-vr.html" class="btn gold">🎬 Full 8-Photo VR Suite</a>
    </div>
  </header>

  <footer class="bottom-dock">
    <div class="dock-row">
      <span class="hint" id="waypointCaption">Playing Live Google Flow Drone Flight · River Tavy Weir → Under Abbey Bridge Arch</span>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn" id="resetCamBtn">🎯 Center View</button>
        <button type="button" class="btn gold" id="replayBtn">↺ Replay Flight</button>
      </div>
    </div>
    <div class="node-pills" id="nodePills">
      <button type="button" class="node-btn active" data-time="0.2">1. River Tavy Weir (0s)</button>
      <button type="button" class="node-btn" data-time="2.6">2. Approaching Abbey Bridge (2.6s)</button>
      <button type="button" class="node-btn" data-time="4.8">3. Entering Stone Arch (4.8s)</button>
      <button type="button" class="node-btn" data-time="6.8">4. Beneath Bridge Vault (6.8s)</button>
    </div>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    const stage = document.getElementById('stage360');
    const narratorBtn = document.getElementById('narratorBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const replayBtn = document.getElementById('replayBtn');
    const resetCamBtn = document.getElementById('resetCamBtn');
    const nodeBtns = Array.from(document.querySelectorAll('.node-btn'));

    // Hidden HTML5 Video Element playing the crisp 1280x720 Google Flow MP4 + Narrator Audio
    const videoEl = document.createElement('video');
    videoEl.src = 'assets/tavistock_archive/abbey_drone_orbit.mp4?v=flow2';
    videoEl.crossOrigin = 'anonymous';
    videoEl.loop = true;
    videoEl.muted = true; // Autoplay-safe; unmutes on first click or Narrator button
    videoEl.volume = 1.0;
    videoEl.playsInline = true;
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('webkit-playsinline', '');
    videoEl.play().catch(() => {});

    function updateAudioUI() {
      if (!videoEl.muted) {
        narratorBtn.classList.add('active');
        narratorBtn.textContent = '🔊 Google Flow Narrator ON';
      } else {
        narratorBtn.classList.remove('active');
        narratorBtn.textContent = '🔇 Tap for Google Flow Narrator';
      }
    }

    narratorBtn.addEventListener('click', () => {
      videoEl.muted = !videoEl.muted;
      if (videoEl.paused) videoEl.play().catch(() => {});
      updateAudioUI();
    });

    window.addEventListener('pointerdown', () => {
      if (videoEl.muted) {
        videoEl.muted = false;
        updateAudioUI();
      }
    }, { once: true });

    playPauseBtn.addEventListener('click', () => {
      if (videoEl.paused) {
        videoEl.play();
        playPauseBtn.classList.add('active');
        playPauseBtn.textContent = '⏸ Pause Flight';
      } else {
        videoEl.pause();
        playPauseBtn.classList.remove('active');
        playPauseBtn.textContent = '▶ Play Flight';
      }
    });

    replayBtn.addEventListener('click', () => {
      videoEl.currentTime = 0;
      videoEl.play();
    });

    nodeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const t = parseFloat(btn.dataset.time);
        videoEl.currentTime = t;
        videoEl.play().catch(() => {});
      });
    });

    // Three.js WebXR Sanctuary Stage with Exact 16:9 Unstretched Curved Screen
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x061019);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 1.4, 2.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    stage.appendChild(renderer.domElement);

    const vrBtn = VRButton.createButton(renderer);
    vrBtn.style.bottom = '112px';
    document.body.appendChild(vrBtn);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.4, -10.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 0.5;
    controls.maxDistance = 16.0;
    controls.maxPolarAngle = Math.PI * 0.65;
    controls.minPolarAngle = Math.PI * 0.32;

    // Exact 16:9 curved cinema arc (16.0m wide x 9.0m tall -> zero stretching!)
    const screenGeo = new THREE.PlaneGeometry(16.0, 9.0, 96, 48);
    const pos = screenGeo.attributes.position;
    const radius = 14.0;
    const arc = Math.PI * 0.36;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const u = x / 16.0;
      const th = u * arc;
      pos.setXYZ(i, Math.sin(th) * radius, y + 1.4, -Math.cos(th) * radius + (radius - 10.5));
    }
    screenGeo.computeVertexNormals();

    const videoTex = new THREE.VideoTexture(videoEl);
    videoTex.colorSpace = THREE.SRGBColorSpace;
    videoTex.minFilter = THREE.LinearFilter;
    videoTex.magFilter = THREE.LinearFilter;

    const screenMat = new THREE.MeshBasicMaterial({ map: videoTex, side: THREE.DoubleSide });
    const screenMesh = new THREE.Mesh(screenGeo, screenMat);
    scene.add(screenMesh);

    // Subtle floating River Tavy mist motes around the viewer
    const moteCount = 320;
    const mPos = new Float32Array(moteCount * 3);
    for (let i = 0; i < moteCount; i++) {
      mPos[i * 3] = (Math.random() - 0.5) * 24;
      mPos[i * 3 + 1] = Math.random() * 8 - 1;
      mPos[i * 3 + 2] = -Math.random() * 14;
    }
    const mGeo = new THREE.BufferGeometry();
    mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
    const motes = new THREE.Points(mGeo, new THREE.PointsMaterial({ color: 0x99d6e0, size: 0.05, transparent: true, opacity: 0.45 }));
    scene.add(motes);

    resetCamBtn.addEventListener('click', () => {
      camera.position.set(0, 1.4, 2.2);
      controls.target.set(0, 1.4, -10.5);
      controls.update();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      // Highlight active timeline stop based on live video currentTime
      const ct = videoEl.currentTime || 0;
      let activeIdx = 0;
      if (ct >= 6.0) activeIdx = 3;
      else if (ct >= 4.2) activeIdx = 2;
      else if (ct >= 2.0) activeIdx = 1;
      nodeBtns.forEach((b, i) => b.classList.toggle('active', i === activeIdx));

      motes.rotation.y += 0.0006;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
