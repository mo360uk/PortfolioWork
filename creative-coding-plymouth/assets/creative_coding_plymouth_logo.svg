    <text x="14" y="50" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FAF7F2">VL.Fuse · Niagara</text>
    <text x="14" y="72" font-family="'JetBrains Mono', monospace" font-size="11" fill="#24A186">GPU Shaders · Spout</text>
    <circle cx="0" cy="37" r="6" fill="#FAF7F2" stroke="#1B7F69" stroke-width="2.5"/>
    <circle cx="0" cy="57" r="6" fill="#D4882A" stroke="#FAF7F2" stroke-width="2"/>
    <circle cx="86" cy="88" r="6" fill="#1B7F69" stroke="#FAF7F2" stroke-width="2"/>
  </g>

  <!-- Visual Patching Operator Node 03: Bottom (CHOP / Spatial Audio & Sensors) -->
  <g transform="translate(490, 646)">
    <rect width="220" height="84" rx="10" fill="#0B0F17" stroke="#0E6BA8" stroke-width="2.5"/>
    <rect width="220" height="26" rx="8" fill="#0E6BA8"/>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FAF7F2" letter-spacing="1.5">CHOP · OSC · LIDAR</text>
    <text x="14" y="50" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FAF7F2">36.4 Spatial Audio</text>
    <text x="14" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1589D6">Market Hall · Real Ideas</text>
    <circle cx="0" cy="42" r="6" fill="#FAF7F2" stroke="#0E6BA8" stroke-width="2.5"/>
    <circle cx="220" cy="42" r="6" fill="#FAF7F2" stroke="#1B7F69" stroke-width="2.5"/>
  </g>

  <!-- Geodesic Ring Coordinate Badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#FAF7F2" fill-opacity="0.75">
    <text x="600" y="218" text-anchor="middle" fill="#D4882A">ZENITH 0° · SMEATON BEACON</text>
    <text x="295" y="305" text-anchor="end">DEVONPORT · 50.37°N</text>
    <text x="905" y="305" text-anchor="start">4.14°W · PLYMOUTH SOUND</text>
  </g>

  <!-- Editorial Divider Above Typography Lockup -->
  <line x1="180" y1="772" x2="1020" y2="772" stroke="#C87D28" stroke-width="1.5" stroke-opacity="0.45"/>
  <circle cx="600" cy="772" r="6" fill="#D4882A"/>

  <!-- Official Editorial Typography Block (Strictly Centered & Padded Inside 120px Safe Zone) -->
  <g text-anchor="middle">
    <text x="600" y="814" font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="16" font-weight="700" fill="#D4882A" letter-spacing="5">PLYMOUTH · DEVON · UNITED KINGDOM</text>
    <text x="600" y="886" font-family="'Syne', 'Space Grotesk', 'Inter', sans-serif" font-size="64" font-weight="800" fill="#FAF7F2" letter-spacing="4">CREATIVE CODING</text>
    <text x="600" y="948" font-family="'Syne', 'Space Grotesk', 'Inter', sans-serif" font-size="46" font-weight="700" fill="#D4882A" letter-spacing="11">PLYMOUTH</text>

    <!-- Pill Badges Row -->
    <g transform="translate(600, 988)">
      <rect x="-410" y="-20" width="820" height="36" rx="18" fill="#121926" stroke="#0E6BA8" stroke-width="1.5"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="600" fill="#FAF7F2" letter-spacing="2">MARKET HALL DOME · REAL IDEAS · KARST · THE BOX · PERVASIVE MEDIA</text>
    </g>

    <text x="600" y="1050" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#FAF7F2" fill-opacity="0.72" letter-spacing="1.8">Curated by Mohamed Hossam Elwakil · Mo360 Immersive Studio · +44 7568 668918</text>
  </g>
</svg>
