<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#0E1522"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="ochreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59A38"/>
      <stop offset="50%" stop-color="#D4882A"/>
      <stop offset="100%" stop-color="#C87D28"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1589D6"/>
      <stop offset="100%" stop-color="#0E6BA8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24A186"/>
      <stop offset="100%" stop-color="#1B7F69"/>
    </linearGradient>
    <radialGradient id="domeGlow" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#0E6BA8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1B7F69" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D4882A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C87D28" stop-opacity="0"/>
    </radialGradient>
    <pattern id="spatialGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FAF7F2" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>
  <rect x="120" y="120" width="960" height="960" fill="url(#spatialGrid)"/>

  <!-- Strict 10% 4-Side Safe Margin Architectural Frame (120px all sides) -->
  <rect x="120" y="120" width="960" height="960" rx="18" fill="none" stroke="#C87D28" stroke-width="2" stroke-opacity="0.42"/>
  <rect x="136" y="136" width="928" height="928" rx="12" fill="none" stroke="#0E6BA8" stroke-width="1" stroke-opacity="0.28"/>

  <!-- Studio Ochre Corner Registration Markers -->
  <g stroke="#D4882A" stroke-width="3.5" fill="none" stroke-linecap="square">
    <path d="M 120 164 L 120 120 L 164 120"/>
    <path d="M 1036 120 L 1080 120 L 1080 164"/>
    <path d="M 120 1036 L 120 1080 L 164 1080"/>
    <path d="M 1036 1080 L 1080 1080 L 1080 1036"/>
  </g>

  <!-- Top Metadata Header Inside Safe Margin -->
  <g font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="15" fill="#FAF7F2" fill-opacity="0.72" letter-spacing="3">
    <text x="164" y="176">MO360 IMMERSIVE STUDIO · OFFICIAL EMBLEM</text>
    <text x="1036" y="176" text-anchor="end" fill="#D4882A">180° FULLDOME · NODE PATCH</text>
  </g>
  <line x1="164" y1="194" x2="1036" y2="194" stroke="#C87D28" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Central Fulldome Glow -->
  <circle cx="600" cy="480" r="310" fill="url(#domeGlow)"/>

  <!-- Outer 180 Degree Market Hall Fulldome Geodesic Ring -->
  <circle cx="600" cy="480" r="250" fill="#0B0F17" fill-opacity="0.55" stroke="url(#tealGrad)" stroke-width="3.5"/>
  <circle cx="600" cy="480" r="232" fill="none" stroke="#C87D28" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.75"/>
  <circle cx="600" cy="480" r="196" fill="none" stroke="#1B7F69" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- 180° Equidistant Fisheye Geodesic Dome Ribs (Upper Hemisphere) -->
  <g fill="none" stroke="#0E6BA8" stroke-opacity="0.55" stroke-width="1.6">
    <!-- Concentric Zenith Elevation Rings -->
    <path d="M 368 480 A 232 232 0 0 1 832 480"/>
    <path d="M 404 480 A 196 150 0 0 1 796 480"/>
    <path d="M 445 480 A 155 100 0 0 1 755 480"/>
    <!-- Meridian Ribs -->
    <path d="M 600 230 L 600 730" stroke="#C87D28" stroke-opacity="0.35" stroke-dasharray="4 6"/>
    <path d="M 350 480 L 850 480" stroke="#C87D28" stroke-opacity="0.45"/>
    <path d="M 600 230 C 500 310, 460 395, 445 480"/>
    <path d="M 600 230 C 700 310, 740 395, 755 480"/>
    <path d="M 600 230 C 430 300, 385 390, 368 480"/>
    <path d="M 600 230 C 770 300, 815 390, 832 480"/>
    <!-- Geodesic Triangulation Chords -->
    <polygon points="600,248 485,335 715,335" stroke="#1B7F69" stroke-opacity="0.6" stroke-width="1.4"/>
    <polygon points="485,335 395,435 535,435" stroke="#1B7F69" stroke-opacity="0.5" stroke-width="1.2"/>
    <polygon points="715,335 665,435 805,435" stroke="#1B7F69" stroke-opacity="0.5" stroke-width="1.2"/>
  </g>

  <!-- Lantern Beacon Rays -->
