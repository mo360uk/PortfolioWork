    <line x1="606" y1="318" x2="606" y2="354" stroke="#FAF7F2" stroke-width="1.5"/>
    <!-- Lantern Cupola Dome & Finial -->
    <path d="M 578 318 A 22 20 0 0 1 622 318 Z" fill="url(#ochreGrad)"/>
    <line x1="600" y1="284" x2="600" y2="300" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="600" cy="282" r="5" fill="#FAF7F2"/>
    <!-- Central Beacon Core -->
    <circle cx="600" cy="336" r="7" fill="#FAF7F2"/>
  </g>

  <!-- Plymouth Sound Harmonic Waves (Lower Hemisphere of Ring) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 385 556 Q 440 532, 492 556 T 600 556 T 708 556 T 815 556" stroke="url(#tealGrad)" stroke-width="5"/>
    <path d="M 405 586 Q 455 562, 502 586 T 600 586 T 698 586 T 795 586" stroke="url(#emeraldGrad)" stroke-width="4.5"/>
    <path d="M 435 616 Q 480 594, 520 616 T 600 616 T 680 616 T 765 616" stroke="url(#ochreGrad)" stroke-width="4"/>
  </g>

  <!-- Bezier Node-Graph Patch Cords Connecting Operators -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <!-- Left TOP Node to Beacon & Wave -->
    <path d="M 426 435 C 485 435, 525 336, 582 336" stroke="#D4882A"/>
    <path d="M 426 455 C 480 455, 495 556, 545 556" stroke="#0E6BA8" stroke-dasharray="6 4"/>
    <!-- Right VL Node to Beacon & Wave -->
    <path d="M 774 435 C 715 435, 675 336, 618 336" stroke="#1B7F69"/>
    <path d="M 774 455 C 720 455, 705 586, 655 586" stroke="#D4882A" stroke-dasharray="6 4"/>
