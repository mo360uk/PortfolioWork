    <path d="M 710 688 C 790 688, 860 580, 860 486" stroke="#1B7F69"/>
  </g>

  <!-- Visual Patching Operator Node 01: Left (TouchDesigner TOP) -->
  <g transform="translate(226, 398)">
    <rect width="200" height="88" rx="10" fill="#0B0F17" stroke="#D4882A" stroke-width="2.5"/>
    <rect width="200" height="26" rx="8" fill="#C87D28"/>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0B0F17" letter-spacing="1.5">TOP · DOMEMASTER</text>
    <text x="14" y="50" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FAF7F2">TouchDesigner</text>
    <text x="14" y="72" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D4882A">180° Fisheye · 4K</text>
    <circle cx="200" cy="37" r="6" fill="#FAF7F2" stroke="#C87D28" stroke-width="2.5"/>
    <circle cx="200" cy="57" r="6" fill="#0E6BA8" stroke="#FAF7F2" stroke-width="2"/>
    <circle cx="114" cy="88" r="6" fill="#0E6BA8" stroke="#FAF7F2" stroke-width="2"/>
  </g>

  <!-- Visual Patching Operator Node 02: Right (vvvv gamma 4V + Unreal 5.8) -->
  <g transform="translate(774, 398)">
    <rect width="200" height="88" rx="10" fill="#0B0F17" stroke="#1B7F69" stroke-width="2.5"/>
    <rect width="200" height="26" rx="8" fill="#1B7F69"/>
