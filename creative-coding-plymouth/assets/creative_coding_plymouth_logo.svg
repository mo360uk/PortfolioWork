  <g stroke="#D4882A" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round">
    <line x1="600" y1="318" x2="495" y2="262"/>
    <line x1="600" y1="318" x2="705" y2="262"/>
    <line x1="600" y1="318" x2="455" y2="318"/>
    <line x1="600" y1="318" x2="745" y2="318"/>
  </g>

  <!-- Smeaton's Tower Iconic Geometric Lighthouse Silhouette (Plymouth Hoe) -->
  <g>
    <!-- Base Foundation Plinth -->
    <path d="M 536 538 L 664 538 L 652 516 L 548 516 Z" fill="#FAF7F2"/>
    <!-- Band 1: Studio Ochre -->
    <path d="M 548 516 L 652 516 L 640 478 L 560 478 Z" fill="url(#ochreGrad)"/>
    <!-- Band 2: Warm Museum Off-White -->
    <path d="M 560 478 L 640 478 L 631 440 L 569 440 Z" fill="#FAF7F2"/>
    <!-- Band 3: Studio Ochre -->
    <path d="M 569 440 L 631 440 L 624 402 L 576 402 Z" fill="url(#ochreGrad)"/>
    <!-- Band 4: Warm Museum Off-White -->
    <path d="M 576 402 L 624 402 L 619 366 L 581 366 Z" fill="#FAF7F2"/>
